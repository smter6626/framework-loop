[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miniloop"
version = "0.1.0"
description = "Local deterministic Reviewer–Executor orchestration skeleton"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
miniloop = "miniloop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
